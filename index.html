<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet Music – Even G2</title>
  <script>
    // iOS compatibility for PDF.js 6.x. Older WKWebView versions do not yet
    // provide the Map upsert proposal used by PDF.js. Install the standards-
    // compatible methods before any ES module (and therefore PDF.js) loads.
    (function () {
      if (typeof Map !== 'undefined' && !Map.prototype.getOrInsert) {
        Object.defineProperty(Map.prototype, 'getOrInsert', {
          configurable: true, writable: true,
          value: function (key, value) {
            if (this.has(key)) return this.get(key);
            this.set(key, value);
            return value;
          }
        });
      }
      if (typeof Map !== 'undefined' && !Map.prototype.getOrInsertComputed) {
        Object.defineProperty(Map.prototype, 'getOrInsertComputed', {
          configurable: true, writable: true,
          value: function (key, callback) {
            if (this.has(key)) return this.get(key);
            var value = callback(key);
            this.set(key, value);
            return value;
          }
        });
      }
      if (typeof WeakMap !== 'undefined' && !WeakMap.prototype.getOrInsert) {
        Object.defineProperty(WeakMap.prototype, 'getOrInsert', {
          configurable: true, writable: true,
          value: function (key, value) {
            if (this.has(key)) return this.get(key);
            this.set(key, value);
            return value;
          }
        });
      }
      if (typeof WeakMap !== 'undefined' && !WeakMap.prototype.getOrInsertComputed) {
        Object.defineProperty(WeakMap.prototype, 'getOrInsertComputed', {
          configurable: true, writable: true,
          value: function (key, callback) {
            if (this.has(key)) return this.get(key);
            var value = callback(key);
            this.set(key, value);
            return value;
          }
        });
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
